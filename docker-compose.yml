# Void Occult — local stack (hot-reload, no rebuild for day-to-day).
#   cp backend/.env.example backend/.env   # rồi điền GEMINI_API_KEY
#   docker network create routing          # once
#   docker compose up -d                   # no --build needed after images exist
#
# Frontend: Vite on :5173 (bind-mounted source).
# Backend:  uvicorn --reload on :8000 (bind-mounted app/).
# Prod-like static nginx preview (optional, needs build):
#   docker compose -f docker-compose.yml -f docker-compose.static.yml up -d --build frontend-static
services:
  backend:
    build: ./backend
    image: void-occult-backend:local
    container_name: apexvoid-occult-backend
    ports:
      - "8000:8000"
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URI=mongodb://mongodb:27017
    volumes:
      - ./backend/app:/app/app
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - routing

  frontend:
    image: node:24-alpine
    container_name: apexvoid-occult-frontend
    working_dir: /app
    # Install into the named volume only when empty — skip on later starts.
    command: >-
      sh -c "if [ ! -x node_modules/.bin/vite ]; then npm ci; fi
      && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    environment:
      OCCULT_API_PROXY: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - routing

  mongodb:
    image: mongo:6.0
    container_name: apexvoid-occult-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - routing

networks:
  routing:
    name: "${ROUTING_NETWORK:-routing}"
    external: true

volumes:
  mongodb_data:
  frontend_node_modules:
