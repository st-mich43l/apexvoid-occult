# Frontend-only Vite preview (no routing network / backend required).
#   docker compose -f docker-compose.dev.yml up -d
# Mở: http://localhost:5173
#
# Full stack instead: docker compose up -d  (see docker-compose.yml)
services:
  frontend-dev:
    image: node:24-alpine
    container_name: apexvoid-occult-frontend-dev
    working_dir: /app
    command: >-
      sh -c "if [ ! -x node_modules/.bin/vite ]; then npm ci; fi
      && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - frontend_dev_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  frontend_dev_node_modules:
