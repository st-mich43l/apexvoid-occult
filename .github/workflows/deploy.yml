name: Build & Deploy

on:
  pull_request:
    branches: [master]
    paths:
      - "backend/**"
      - "src/**"
      - "scripts/**"
      - "tests/contracts/**"
      - "deploy/**"
      - "deployment-template/**"
      - "index.html"
      - "package*.json"
      - "knip.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - ".github/workflows/deploy.yml"
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "src/**"
      - "scripts/**"
      - "tests/contracts/**"
      - "deploy/**"
      - "deployment-template/**"
      - "index.html"
      - "package*.json"
      - "knip.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apexvoid-occult-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          show-progress: false

      - name: Check whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"

      - name: Check pushed commit
        if: github.event_name != 'pull_request'
        run: git show --check --oneline --no-renames HEAD

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check API contract artifacts
        run: npm run api:check

      - name: Audit dead code
        run: npm run audit:dead-code

      - name: Typecheck
        run: npm run typecheck

      - name: Monthly Flow V1 release gate
        run: npm run release:monthly-flow-v1:gate

      - name: Palace Overview scoring validation
        run: PALACE_OVERVIEW_GATE_SKIP_HEAVY_G0=1 npm run validate:palace-overview

      - name: Palace Overview benchmark validation
        run: npm run research:palace-overview:validate-reviews

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Verify tests do not rewrite source files
        run: test -z "$(git status --porcelain)"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Test backend
        working-directory: backend
        run: python -m unittest discover -s tests

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
    uses: st-mich43l/action-library/.github/workflows/build-push-deploy.yml@e9594acd93befdd1020ad06687ba05d03b14c80e
    with:
      project: apexvoid-occult
      registry-namespace: mich43l
      images: >-
        [
          {"name": "apexvoid-occult-backend",  "context": "backend", "dockerfile": "backend/Dockerfile"},
          {"name": "apexvoid-occult-frontend", "context": ".",        "dockerfile": "deploy/frontend.Dockerfile"}
        ]
    secrets:
      registry-token: ${{ secrets.DOCKERHUB_TOKEN }}
      vault-password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
